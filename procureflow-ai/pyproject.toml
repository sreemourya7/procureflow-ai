[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "procureflow-ai"
version = "0.1.0"
description = "Evidence-backed procurement agents with PyTorch routing and durable human review"
requires-python = ">=3.11"
dependencies = ["torch>=2.5,<3", "numpy>=1.26,<3", "scikit-learn>=1.4,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.8,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
procureflow = "procureflow.cli:main"

[tool.setuptools.packages.find]
include = ["procureflow*"]

[tool.setuptools.package-data]
procureflow = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
